# =============================================================================
# DEPLOYMENT: diamo-website → www.diamo.club (Production)
# =============================================================================
# This workflow deploys ONLY the Astro landing page (diamo-website) to the
# production domain www.diamo.club via FTP.
#
# IMPORTANT: This deployment is completely separate from the Diamo web-app
# (test environment). It does NOT use Firebase Hosting and will NOT affect
# any other project or environment.
#
# Target: www.diamo.club (FTP)
# Source: ./dist/ (Astro build output)
# Trigger: Push to main branch only
# =============================================================================

name: Deploy to Production (www.diamo.club)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment
        run: cp .env.public .env

      - name: Build Astro site
        run: npm run build

      - name: Deploy to FTP server (www.diamo.club)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: /
          dangerous-clean-slate: true
